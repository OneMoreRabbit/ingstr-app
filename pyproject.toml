[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingstr"
version = "0.1.0"
description = "Document ingestion pipeline that walks a filesystem tree, parses + chunks documents, embeds via Ollama, and upserts into Qdrant with RBAC classification metadata."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ingstr Contributors" },
]
keywords = ["qdrant", "rag", "ingestion", "embedding", "rbac", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Text Processing",
]
dependencies = [
    "qdrant-client>=1.9,<2.0",
    "unstructured>=0.14,<1.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "structlog>=24.1,<26.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[qdrant]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ingstr = "ingstr.cli:main"

[project.urls]
Homepage = "https://github.com/jobcpf/ingstr"
Issues = "https://github.com/jobcpf/ingstr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ingstr"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ingstr",
    "README.md",
    "LICENSE",
    "config.example.yml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests requiring external services (Qdrant, Ollama). Skipped unless explicitly selected.",
]

[tool.coverage.run]
source = ["src/ingstr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
