# Ingstr deploy on otter — compose example.
#
# ONE DEPLOYMENT, ONE CONTAINER PER ORG PER RUN (v0.2.0). One config.yml
# lists every org; each run names its org with --org and only that org's
# folder is mounted. Per-org Qdrant and state volume; shared Ollama and
# shared host-mounted registry. The org's data share is NFS-mounted
# INSIDE the container (so otter's host filesystem stays free of org
# data).
#
# One stack directory per org, as before: the directory name becomes the
# compose project name, which is what keeps each org's state volume its
# own.
#
# Variables expected from --env-file (typically secrets.env, populated
# by Ansible at deploy time):
#
#   QDRANT_RW_API_KEY      (required)  per-org Qdrant write key
#   QDRANT_NETWORK         (required)  per-org Docker network name, e.g. "qdrant_arc_net"
#   INGSTR_VERSION         (REQUIRED)  image tag, e.g. "v0.1.0". There is
#                                      deliberately NO "latest" fallback:
#                                      the tag decides what code runs, and
#                                      a plausible default for that is what
#                                      constitution §11 forbids. `dev` is
#                                      ahead of the newest tag, so :latest
#                                      names something no tag describes.
#                                      An unset value fails the run.
#   ORG_DATA_NFS_ADDR      (required)  NFS server address, e.g. "10.0.0.10"
#   ORG_DATA_NFS_DEVICE    (required)  NFS export path, e.g. ":/exports/arc/drive"
#   ORG_DATA_NFS_OPTIONS   (optional)  mount opts, defaults to "soft,ro,nolock"
#
# QDRANT_NETWORK names a per-org external network created by the Qdrant
# compose stack. The Qdrant container joins that network with service
# name `qdrant_<org>` (so Ingstr's config.yml:qdrant.url reads
# "http://qdrant_<org>:6333" and Docker DNS resolves it inside the
# network). Qdrant has no published ports — only the future query proxy
# does — so the per-org network is the only path Ingstr can reach it.
#
# Ingstr is a one-shot job. Do NOT `docker compose up`. Invoke runs
# explicitly:
#
#   docker compose --env-file secrets.env run --rm -T ingstr health --org arc
#   docker compose --env-file secrets.env run --rm -T ingstr ingest --org arc --dry-run
#   docker compose --env-file secrets.env run --rm -T ingstr ingest --org arc
#
# --org may be omitted only when config.yml lists exactly one org.
#
# Or wire a `docker compose run` invocation into a systemd .service
# unit triggered by a .path unit (see deploy/systemd/).

services:
  ingstr:
    image: ghcr.io/onemorerabbit/ingstr-app:${INGSTR_VERSION:?INGSTR_VERSION must be set — no :latest fallback, see below}
    networks:
      # Per-org network created by the Qdrant compose stack. Lets Ingstr
      # resolve `qdrant_<org>` via Docker DNS without LAN exposure.
      - qdrant_net
    volumes:
      # Org data: NFS mounted by Docker INTO the container.
      # otter's host filesystem doesn't see this share.
      - org_data:/mnt/data:ro

      # Registry: compiled_plan.yml + group_gid_map.yml. Host-mounted on
      # otter at /mnt/registry and bind-mounted into the container at the
      # same path. Shared across all orgs on the host.
      - /mnt/registry:/mnt/registry:ro

      # Operator-managed config (host-side, Ansible-deployed). The `.`
      # resolves to the directory containing this compose.yml — so for
      # per-org production deploys at /etc/ingstr/<org>/compose.yml the
      # container sees that org's config.yml at /etc/ingstr/config.yml,
      # and for manual testing at /home/<user>/docker/ingstr/<org>/ the
      # same mapping holds. config.yml MUST sit alongside compose.yml.
      - .:/etc/ingstr:ro

      # SQLite state DB. Per-org named volume so it persists across
      # container churn. Compose prefixes volume names with the project
      # name (the directory the compose file lives in), giving you
      # automatic per-org isolation when you organise as
      # /etc/ingstr/<org>/compose.yml.
      - ingstr-state:/var/lib/ingstr
    environment:
      INGSTR_CONFIG: /etc/ingstr/config.yml
      QDRANT_RW_API_KEY: ${QDRANT_RW_API_KEY:?QDRANT_RW_API_KEY must be set}
    # Logs go to docker journald — structlog already emits JSON to stdout.

networks:
  # Per-org Qdrant network. Created by the Qdrant compose stack as a
  # regular bridge network; declared `external` here so Ingstr just
  # joins it rather than trying to create it.
  qdrant_net:
    external: true
    name: ${QDRANT_NETWORK:?QDRANT_NETWORK must be set}

volumes:
  # Org data NFS volume. Docker mounts this NFS share when the container
  # starts, scoped to the container's network namespace. The mount is
  # invisible to the host. For deploys where the data lives on a host
  # bind mount instead, replace this whole block with a bind volume.
  org_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${ORG_DATA_NFS_ADDR:?ORG_DATA_NFS_ADDR must be set},${ORG_DATA_NFS_OPTIONS:-soft,ro,nolock}"
      device: ${ORG_DATA_NFS_DEVICE:?ORG_DATA_NFS_DEVICE must be set}

  # Per-org state DB volume. Project-name prefix gives multi-org
  # isolation automatically.
  ingstr-state:
