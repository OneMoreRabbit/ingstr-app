# Ingstr deploy on otter — compose example.
#
# Qdrant and Ollama are NOT defined here; they are managed by separate
# Ansible-deployed compose stacks. This file only declares the Ingstr service
# and assumes both peers are reachable over a shared external Docker network.
#
# Ingstr is a one-shot job. Do NOT `docker compose up` this stack — there is
# no long-running service to keep alive. Invoke runs explicitly:
#
#   docker compose -f compose.yml run --rm ingstr health
#   docker compose -f compose.yml run --rm ingstr ingest --dry-run
#   docker compose -f compose.yml run --rm ingstr ingest
#
# Or wire `docker compose run` into a systemd .service unit triggered by a
# .path unit watching /mnt/raid_arc/.last_sync (see deploy/systemd/).

services:
  ingstr:
    image: ghcr.io/jobcpf/ingstr:latest
    networks:
      - rag-net                                # peer with qdrant + ollama
    volumes:
      # Source data (NFS, read-only). File group ownership drives classification.
      - /mnt/raid_arc:/mnt/raid_arc:ro

      # Registry: compiled_plan.yml + group_gid_map.yml (read-only).
      - /mnt/registry:/mnt/registry:ro

      # Operator-managed config (host-side, Ansible-deployed).
      - /etc/ingstr:/etc/ingstr:ro

      # SQLite state DB. Named volume so it persists across container churn.
      - ingstr-state:/var/lib/ingstr
    environment:
      INGSTR_CONFIG: /etc/ingstr/config.yml

      # Required: Qdrant write API key. Do NOT commit. Provide via:
      #   docker compose --env-file /etc/ingstr/secrets.env run ...
      # or via host environment.
      QDRANT_RW_API_KEY: ${QDRANT_RW_API_KEY:?QDRANT_RW_API_KEY must be set}
    # Logs go to docker journal — structlog already emits JSON to stdout.

# Peers (qdrant, ollama) live on this externally-managed network. Replace the
# name with whatever the upstream Ansible role created.
networks:
  rag-net:
    external: true

volumes:
  ingstr-state:
